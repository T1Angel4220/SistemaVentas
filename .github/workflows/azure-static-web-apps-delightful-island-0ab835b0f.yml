name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - feature/frontend-responsividad
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - feature/frontend-responsividad

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://backend-sistema-ventas-g9hhdue0fehhagdj.canadacentral-01.azurewebsites.net
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Debug - Verificar token
        run: |
          echo "🔍 Verificando configuración del token..."
          if [ -z "$TOKEN" ]; then
            echo "❌ ERROR: El token NO está configurado o está vacío"
            exit 1
          else
            TOKEN_LENGTH=${#TOKEN}
            echo "✅ El token SÍ está configurado"
            echo "📏 Longitud del token: $TOKEN_LENGTH caracteres"
            echo "🔑 Primeros 20 caracteres: ${TOKEN:0:20}..."
            echo "🔑 Últimos 20 caracteres: ...${TOKEN: -20}"
          fi
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_ISLAND_0AB835B0F }}

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_ISLAND_0AB835B0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "./frontend"
          api_location: ""
          output_location: "dist"
          app_build_command: "npm run build"
          ###### End of Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_ISLAND_0AB835B0F }}
          action: "close"
