name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - feature/frontend-responsividad
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - feature/frontend-responsividad

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://backend-sistema-ventas-g9hhdue0fehhagdj.canadacentral-01.azurewebsites.net
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: https://backend-sistema-ventas-g9hhdue0fehhagdj.canadacentral-01.azurewebsites.net
      - name: Copy staticwebapp.config.json to dist
        run: |
          cp frontend/staticwebapp.config.json frontend/dist/staticwebapp.config.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_MUD_057F2D60F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "./frontend"     # Path de tu proyecto React
          api_location: ""               # No usas API Functions aquí
          app_artifact_location: "frontend/dist"  # ✅ Ruta completa desde la raíz del repo cuando usamos skip_app_build
          skip_app_build: true           # ✅ Saltar el build de Oryx porque ya construimos con Node 22
          ###### End of Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_MUD_057F2D60F }}
          action: "close"
