name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - feature/frontend-responsividad
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - feature/frontend-responsividad

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://backend-sistema-ventas-g9hhdue0fehhagdj.canadacentral-01.azurewebsites.net
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_MUD_057F2D60F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "./frontend"     # Path de tu proyecto React
          api_location: ""               # No usas API Functions aquí
          output_location: "dist"        # ⚠️ Vite genera la build aquí, no en 'build'
          ###### End of Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_MUD_057F2D60F }}
          action: "close"
