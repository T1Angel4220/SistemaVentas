apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: sistema-ventas
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3001
    name: http
  type: ClusterIP
  # Para desarrollo local con minikube, usar NodePort:
  # type: NodePort
  # nodePort: 30001

