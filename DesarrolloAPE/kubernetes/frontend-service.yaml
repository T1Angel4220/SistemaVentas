apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: sistema-ventas
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    name: http
  type: LoadBalancer
  # Para minikube o desarrollo local, usar NodePort:
  # type: NodePort
  # nodePort: 30002

