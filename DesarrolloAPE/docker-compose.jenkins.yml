version: '3.8'

services:
  # Jenkins CI/CD Server
  jenkins:
    image: jenkins/jenkins:lts
    container_name: sistema-ventas-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    networks:
      - app-network
    environment:
      - JENKINS_OPTS=--httpPort=8080
    restart: unless-stopped
    privileged: true

volumes:
  jenkins_home:
    driver: local

networks:
  app-network:
    driver: bridge
    external: true

