version: '3.8'

services:
  # Jenkins CI/CD Server
  # IMPORTANTE: Jenkins se ejecuta en contenedor Docker
  # En Windows con Docker Desktop, el socket de Docker está disponible a través de WSL2
  # La configuración monta el socket de Docker del host para que Jenkins pueda construir imágenes
  jenkins:
    image: jenkins/jenkins:lts
    container_name: sistema-ventas-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Montar socket de Docker del host (funciona en Windows con Docker Desktop + WSL2)
      - /var/run/docker.sock:/var/run/docker.sock
      # NOTA: No montamos /usr/bin/docker en Windows, lo instalaremos dentro del contenedor
    networks:
      - app-network
    environment:
      - JENKINS_OPTS=--httpPort=8080
    restart: unless-stopped
    privileged: true

  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: sistema-ventas-db
    environment:
      POSTGRES_DB: sistema_ventas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: DesarrolloAPE/Dockerfile.backend
    container_name: sistema-ventas-backend
    environment:
      NODE_ENV: production
      # Servidor
      PORT: 3001
      HOST: ${HOST:-0.0.0.0}
      # Base de datos PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sistema_ventas
      DB_USER: postgres
      DB_PASSWORD: postgres
      # JWT
      JWT_SECRET: ${JWT_SECRET:-tu-jwt-secret-muy-seguro-cambiar-en-produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Configuración de email (ajustar según tu proveedor)
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-noreply@example.com}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-${EMAIL_PASS:-}}
      EMAIL_FROM: ${EMAIL_FROM:-Sistema de Ventas <noreply@example.com>}
      # Seguridad
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/uploads:/app/uploads
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React
  frontend:
    build:
      context: ..
      dockerfile: DesarrolloAPE/Dockerfile.frontend
    container_name: sistema-ventas-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  jenkins_home:
    driver: local
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge

